<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Boost</title>
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="Convert 30 fps video to 60 fps and upscale to 1080p, right in your browser.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frame Boost">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--bg:#0b0b0d;--panel:#131316;--line:#25252b;--text:#e9e9ec;--dim:#8b8b95;--acc:#5b8cff}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:680px;margin:0 auto;padding:28px 18px 60px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .top img{border-radius:10px;flex:none}
  .top .sub{margin:0}
  .top h1{margin:0 0 2px}
  #install{flex:none;width:auto;margin-left:auto;padding:8px 12px;font-size:13px}
  h1{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--dim);margin:0 0 22px;font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .drop{display:block;text-align:center;border:1px dashed #34343c;border-radius:14px;padding:26px 14px;cursor:pointer;color:var(--dim);transition:border-color .2s,color .2s}
  .drop:hover,.drop.over{border-color:var(--acc);color:var(--text)}
  .drop input{display:none}
  #info{margin-top:10px;font-size:13px;color:var(--dim);min-height:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.grid{grid-template-columns:1fr}}
  label.f{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  input[type=number],select{width:100%;background:#0e0e11;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 10px;font:inherit}
  input[type=file]{color:var(--dim);font:inherit;font-size:13px;width:100%}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .row{display:flex;gap:10px;margin-top:14px}
  button{flex:1;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;transition:opacity .15s,transform .1s}
  button:active{transform:scale(.98)}
  button.sec{background:#1c1c22;color:var(--text);border:1px solid var(--line)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .bar{height:6px;background:#1c1c22;border-radius:6px;overflow:hidden;margin-top:6px}
  .bar>div{height:100%;width:0;background:var(--acc);transition:width .15s}
  #stats{font-size:13px;color:var(--dim);margin-top:8px;font-variant-numeric:tabular-nums}
  #est{font-size:13px;margin-top:12px;color:var(--text)}
  #log{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);max-height:140px;overflow:auto;white-space:pre-wrap}
  #result video{width:100%;border-radius:10px;background:#000;margin-top:10px}
  a.dl{display:block;text-align:center;text-decoration:none;background:var(--acc);color:#fff;border-radius:10px;padding:12px;font-weight:600}
  .warn{color:#ffb454;font-size:13px}
  .hide{display:none}
</style>
</head>
<body>
<main>
  <header class="top">
    <img src="icon-192.png" alt="" width="46" height="46">
    <div><h1>Frame Boost</h1>
    <p class="sub">Frame interpolation and upscaling, in your browser. Nothing is uploaded anywhere.</p></div>
    <button id="install" class="sec hide">Install app</button>
  </header>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="video/*">
    <span id="dropText">Choose or drop a video</span>
  </label>
  <div id="info"></div>
  <div id="support" class="warn"></div>

  <div class="card" style="margin-top:14px">
    <div class="grid">
      <div><label class="f">Source FPS</label><input type="number" id="srcFps" value="30" step="0.001" min="1"></div>
      <div><label class="f">Target FPS</label><input type="number" id="outFps" value="60" step="0.001" min="1"></div>
      <div><label class="f">Output height</label>
        <select id="outH">
          <option value="1080" selected>1080p (1920×1080)</option>
          <option value="1440">1440p</option>
          <option value="2160">2160p (4K)</option>
          <option value="0">Keep source size</option>
        </select></div>
      <div><label class="f">Bitrate (Mbps)</label><input type="number" id="mbps" value="20" min="1" max="200"></div>
      <div><label class="f">New frames</label>
        <select id="interp">
          <option value="mv" selected>Motion-compensated</option>
          <option value="blend">Simple blend (fast)</option>
        </select></div>
      <div><label class="f">Motion search range</label>
        <select id="range">
          <option value="6">Small</option>
          <option value="8" selected>Medium</option>
          <option value="12">Large (slower)</option>
        </select></div>
    </div>
    <div style="margin-top:12px"><label class="f">Sharpen: <span id="shV">0.30</span></label>
      <input type="range" id="sharp" min="0" max="1" step="0.05" value="0.3"></div>
    <div style="margin-top:12px"><label class="f">Audio file (optional: .m4a, .aac, .mp3, .wav). Replaces the video's own audio and is much faster if the video's audio can't be copied.</label>
      <input type="file" id="audioFile" accept="audio/*,.m4a,.aac"></div>
    <label class="f" style="margin-top:10px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="rtCap"> Allow slow real-time audio capture if everything else fails</label>
    <div id="est"></div>
    <div class="row">
      <button id="go" disabled>Convert</button>
      <button id="stop" class="sec" disabled>Cancel</button>
    </div>
    <div class="bar"><div id="prog"></div></div>
    <div id="stats"></div>
    <div class="sub" style="font-size:12px;margin:8px 0 0">Tip: leave this page open while it converts. It keeps your screen awake and sends a notification when it finishes.</div>
  </div>

  <div class="card hide" id="resultCard"><div id="result"></div></div>
  <div class="card"><div id="log">Ready.</div></div>
</main>

<script>
(function(){
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const logEl = $('log');
function log(m){ logEl.textContent += '\n' + m; logEl.scrollTop = logEl.scrollHeight; }

let file = null, video = null, blobUrl = null, meta = {}, cancelled = false, running = false;

// ---------- load muxer ----------
const muxerReady = (async () => {
  const urls = [
    'https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js',
    'https://unpkg.com/mp4-muxer@5/build/mp4-muxer.js'
  ];
  for (const u of urls) {
    try {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
      if (window.Mp4Muxer) return true;
    } catch (e) {}
  }
  return false;
})();

log('Frame Boost v7 loaded.');
const mp4boxReady = (async () => {
  const urls = [
    'https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js',
    'https://unpkg.com/mp4box@0.5.2/dist/mp4box.all.min.js'
  ];
  for (const u of urls) {
    try {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
      if (window.MP4Box) return true;
    } catch (e) {}
  }
  return false;
})();

if (!('VideoEncoder' in window)) {
  $('support').textContent = 'This browser has no WebCodecs encoder. Use recent Chrome or Edge (desktop or Android).';
}

$('sharp').oninput = e => $('shV').textContent = (+e.target.value).toFixed(2);

// ---------- background support ----------
const BASE_TITLE = document.title;
let wakeLock = null, kaCtx = null, kaOsc = null;
async function startKeepAlive(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  try {
    // A silent, inaudible tone stops the browser from throttling or freezing the tab while it works.
    const AC2 = window.AudioContext || window.webkitAudioContext;
    if (!kaCtx) kaCtx = new AC2();
    await kaCtx.resume();
    kaOsc = kaCtx.createOscillator();
    const g = kaCtx.createGain(); g.gain.value = 0.0005; kaOsc.frequency.value = 30;
    kaOsc.connect(g); g.connect(kaCtx.destination); kaOsc.start();
  } catch (e) {}
}
function stopKeepAlive(){
  try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null;
  try { if (kaOsc) kaOsc.stop(); } catch (e) {} kaOsc = null;
  document.title = BASE_TITLE;
}
async function notify(title, body){
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
    const opts = { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'frameboost' };
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) { await reg.showNotification(title, opts); return; }
    }
    new Notification(title, opts);
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) {}
}
document.addEventListener('visibilitychange', async () => {
  if (running && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
});
window.addEventListener('beforeunload', e => { if (running) { e.preventDefault(); e.returnValue = ''; } });

// ---------- install as app ----------
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('install').classList.remove('hide'); });
$('install').onclick = async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  try { await deferredInstall.userChoice; } catch (e) {}
  deferredInstall = null; $('install').classList.add('hide');
};
window.addEventListener('appinstalled', () => $('install').classList.add('hide'));
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

function fmtSize(b){ return b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : (b / 1048576).toFixed(1) + ' MB'; }
function updateEst(){
  if (!meta.dur) { $('est').textContent = ''; return; }
  const mb = +$('mbps').value || 0;
  const v = mb * 1e6 / 8 * meta.dur, a = 192000 / 8 * meta.dur;
  $('est').textContent = `Estimated output size: up to ~${fmtSize(v + a)} (video ~${fmtSize(v)} at ${mb} Mbps + audio ~${fmtSize(a)})`;
}
$('mbps').oninput = updateEst;

// ---------- file select ----------
const drop = $('drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); });
$('file').onchange = e => { if (e.target.files[0]) pick(e.target.files[0]); };

const COMMON = [23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60];
async function detectFps(v){
  if (!('requestVideoFrameCallback' in v)) return null;
  return new Promise(res => {
    const times = []; let done = false;
    const finish = () => {
      if (done) return; done = true;
      try { v.pause(); v.currentTime = 0; } catch(e){}
      const d = [];
      for (let i = 1; i < times.length; i++) { const x = times[i] - times[i-1]; if (x > 0) d.push(x); }
      if (d.length < 3) return res(null);
      d.sort((a,b) => a-b);
      res(1 / d[d.length >> 1]);
    };
    const cb = (now, m) => { times.push(m.mediaTime); if (times.length < 24) v.requestVideoFrameCallback(cb); else finish(); };
    v.requestVideoFrameCallback(cb);
    v.play().catch(finish);
    setTimeout(finish, 2500);
  });
}

async function pick(f){
  file = f;
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(f);
  $('dropText').textContent = f.name;
  $('go').disabled = true;
  $('info').textContent = 'Reading…';
  video = document.createElement('video');
  video.muted = true; video.playsInline = true; video.preload = 'auto';
  video.src = blobUrl;
  try {
    await new Promise((res, rej) => { video.onloadedmetadata = res; video.onerror = () => rej(new Error('Cannot decode this video in the browser.')); });
  } catch(e){ $('info').textContent = e.message; return; }
  meta = { w: video.videoWidth, h: video.videoHeight, dur: video.duration };
  let fps = await detectFps(video);
  if (fps) {
    const near = COMMON.reduce((b, c) => Math.abs(c - fps) < Math.abs(b - fps) ? c : b, COMMON[0]);
    const isNear = Math.abs(near - fps) < 0.35;
    fps = isNear ? near : Math.round(fps * 100) / 100;
    $('srcFps').value = fps;
  }
  $('info').textContent = `${meta.w}×${meta.h} · ${meta.dur.toFixed(2)}s · ${fps ? fps + ' fps detected' : 'fps not detected, set it manually'}`;
  $('go').disabled = false;
  updateEst();
  log('Loaded ' + f.name);
}

// ---------- WebGL ----------
const VS = `#version 300 es
out vec2 uv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  uv = vec2(p.x, 1.0 - p.y);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const FS = `#version 300 es
precision highp float;
in vec2 uv; out vec4 outc;
uniform sampler2D A; uniform sampler2D B; uniform sampler2D M;
uniform vec2 srcSize; uniform vec2 mvRange;
uniform float t; uniform int mode; uniform float sharp; uniform int useMV;

vec3 cr(sampler2D tx, vec2 p){
  vec2 pos = p * srcSize;
  vec2 c = floor(pos - 0.5) + 0.5;
  vec2 f = pos - c;
  vec2 w0 = f * (-0.5 + f * (1.0 - 0.5 * f));
  vec2 w1 = 1.0 + f * f * (-2.5 + 1.5 * f);
  vec2 w2 = f * (0.5 + f * (2.0 - 1.5 * f));
  vec2 w3 = f * f * (-0.5 + 0.5 * f);
  vec2 w12 = w1 + w2;
  vec2 t12 = (c + w2 / w12) / srcSize;
  vec2 t0 = (c - 1.0) / srcSize;
  vec2 t3 = (c + 2.0) / srcSize;
  vec3 r = texture(tx, vec2(t0.x, t0.y)).rgb * (w0.x * w0.y)
         + texture(tx, vec2(t12.x, t0.y)).rgb * (w12.x * w0.y)
         + texture(tx, vec2(t3.x, t0.y)).rgb * (w3.x * w0.y)
         + texture(tx, vec2(t0.x, t12.y)).rgb * (w0.x * w12.y)
         + texture(tx, vec2(t12.x, t12.y)).rgb * (w12.x * w12.y)
         + texture(tx, vec2(t3.x, t12.y)).rgb * (w3.x * w12.y)
         + texture(tx, vec2(t0.x, t3.y)).rgb * (w0.x * w3.y)
         + texture(tx, vec2(t12.x, t3.y)).rgb * (w12.x * w3.y)
         + texture(tx, vec2(t3.x, t3.y)).rgb * (w3.x * w3.y);
  return clamp(r, 0.0, 1.0);
}

void main(){
  vec3 col; vec3 base;
  if (mode == 1) { col = cr(A, uv); base = texture(A, uv).rgb; }
  else if (mode == 2) { col = cr(B, uv); base = texture(B, uv).rgb; }
  else {
    vec2 mv = vec2(0.0); float conf = 0.0;
    if (useMV == 1) { vec4 m = texture(M, uv); mv = (m.rg * 2.0 - 1.0) * mvRange; conf = m.b; }
    vec2 ua = uv - mv * t;
    vec2 ub = uv + mv * (1.0 - t);
    vec3 mc = mix(cr(A, ua), cr(B, ub), t);
    if (conf < 0.999) { vec3 fb = mix(cr(A, uv), cr(B, uv), t); mc = mix(fb, mc, conf); }
    col = mc;
    base = mix(texture(A, ua).rgb, texture(B, ub).rgb, t);
  }
  col = clamp(col + sharp * (col - base), 0.0, 1.0);
  outc = vec4(col, 1.0);
}`;

function makeGL(outW, outH){
  const canvas = document.createElement('canvas');
  canvas.width = outW; canvas.height = outH;
  const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
  if (!gl) throw new Error('WebGL2 is not available.');
  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindVertexArray(gl.createVertexArray());
  const u = {};
  ['A','B','M','srcSize','mvRange','t','mode','sharp','useMV'].forEach(n => u[n] = gl.getUniformLocation(prog, n));
  gl.uniform1i(u.A, 0); gl.uniform1i(u.B, 1); gl.uniform1i(u.M, 2);
  gl.viewport(0, 0, outW, outH);
  const mkTex = () => {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  };
  return { canvas, gl, u, mkTex };
}

// ---------- motion estimation (block matching on a downscaled grayscale) ----------
function sad(a, b, W, H, x0, y0, bs, dx, dy, limit){
  let s = 0;
  for (let y = 0; y < bs; y++) {
    const ar = (y0 + y) * W + x0;
    let by = y0 + y + dy; by = by < 0 ? 0 : by >= H ? H - 1 : by;
    const br = by * W;
    for (let x = 0; x < bs; x++) {
      let bx = x0 + x + dx; bx = bx < 0 ? 0 : bx >= W ? W - 1 : bx;
      const d = a[ar + x] - b[br + bx];
      s += d < 0 ? -d : d;
    }
    if (s >= limit) return s;
  }
  return s;
}
function median3(arr, bw, bh){
  const out = new Int16Array(arr.length), w = new Array(9);
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    let k = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = Math.min(bw-1, Math.max(0, x+dx)), yy = Math.min(bh-1, Math.max(0, y+dy));
      w[k++] = arr[yy*bw + xx];
    }
    w.sort((p,q) => p-q);
    out[y*bw + x] = w[4];
  }
  return out;
}
function motion(a, b, W, H, bs, R){
  const bw = W / bs, bh = H / bs, n = bw * bh, area = bs * bs;
  const mx = new Int16Array(n), my = new Int16Array(n), er = new Float32Array(n);
  for (let by = 0; by < bh; by++) for (let bx = 0; bx < bw; bx++) {
    const i = by * bw + bx, x0 = bx * bs, y0 = by * bs;
    const sad0 = sad(a, b, W, H, x0, y0, bs, 0, 0, 1e9);
    let best = sad0 * 0.9, bdx = 0, bdy = 0, real = sad0;
    const tryC = (dx, dy) => {
      if (dx < -R || dx > R || dy < -R || dy > R) return;
      const s = sad(a, b, W, H, x0, y0, bs, dx, dy, best);
      if (s < best) { best = s; real = s; bdx = dx; bdy = dy; }
    };
    if (bx > 0) tryC(mx[i-1], my[i-1]);
    if (by > 0) { tryC(mx[i-bw], my[i-bw]); if (bx < bw-1) tryC(mx[i-bw+1], my[i-bw+1]); }
    for (let dy = -R; dy <= R; dy += 2) for (let dx = -R; dx <= R; dx += 2) tryC(dx, dy);
    const cx = bdx, cy = bdy;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) tryC(cx + dx, cy + dy);
    mx[i] = bdx; my[i] = bdy; er[i] = real / area;
  }
  const mxm = median3(mx, bw, bh), mym = median3(my, bw, bh);
  const R1 = R + 1, bytes = new Uint8Array(n * 4);
  let sum = 0;
  for (let i = 0; i < n; i++) {
    const conf = Math.min(1, Math.max(0, (30 - er[i]) / 18));
    bytes[i*4]   = Math.round((mxm[i] / R1 * 0.5 + 0.5) * 255);
    bytes[i*4+1] = Math.round((mym[i] / R1 * 0.5 + 0.5) * 255);
    bytes[i*4+2] = Math.round(conf * 255);
    bytes[i*4+3] = 255;
    sum += er[i];
  }
  return { bytes, bw, bh, mean: sum / n };
}

// ---------- seeking ----------
function seek(v, t){
  return new Promise(res => {
    const on = () => { v.removeEventListener('seeked', on); res(); };
    v.addEventListener('seeked', on);
    v.currentTime = t;
  });
}
async function settle(v){
  if (!('requestVideoFrameCallback' in v)) { await sleep(20); return; }
  await Promise.race([new Promise(r => v.requestVideoFrameCallback(() => r())), sleep(60)]);
}

// ---------- audio ----------
const AC = window.AudioContext || window.webkitAudioContext;
async function pickAudioCodec(ab){
  if (!('AudioEncoder' in window)) return null;
  const ch = Math.min(2, ab.numberOfChannels), sr = ab.sampleRate;
  for (const [codec, mux] of [['mp4a.40.2', 'aac'], ['opus', 'opus']]) {
    try {
      const s = await AudioEncoder.isConfigSupported({ codec, sampleRate: sr, numberOfChannels: ch, bitrate: 192000 });
      if (s.supported) return { codec, mux };
    } catch (e) {}
  }
  return null;
}
async function decodeFromFile(src){
  const buf = await src.arrayBuffer();
  const ac = new AC({ sampleRate: 48000 });
  try { return await ac.decodeAudioData(buf); } finally { ac.close(); }
}
// Fallback: play the video muted-to-speakers and record its audio in real time.
async function captureRealtime(){
  if (!window.MediaRecorder || !AC) return null;
  const v = document.createElement('video');
  v.src = blobUrl; v.playsInline = true; v.preload = 'auto';
  await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error('cannot load video')); });
  const ac = new AC({ sampleRate: 48000 });
  const src = ac.createMediaElementSource(v);
  const dest = ac.createMediaStreamDestination();
  src.connect(dest);
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(dest.stream, mime ? { mimeType: mime } : undefined);
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => rec.onstop = r);
  await ac.resume();
  rec.start(500);
  await v.play();
  let noAudio = false;
  await new Promise(res => {
    const t0 = performance.now();
    const iv = setInterval(() => {
      const el = (performance.now() - t0) / 1000;
      $('stats').textContent = `Capturing audio in real time… ${fmtT(v.currentTime)} / ${fmtT(meta.dur)}`;
      if (cancelled || v.ended) { clearInterval(iv); res(); }
      else if (el > 2 && typeof v.webkitAudioDecodedByteCount === 'number' && v.webkitAudioDecodedByteCount === 0) { noAudio = true; clearInterval(iv); res(); }
    }, 250);
  });
  v.pause();
  if (rec.state !== 'inactive') rec.stop();
  await stopped;
  if (noAudio || cancelled || !chunks.length) { ac.close(); return null; }
  const ab = await ac.decodeAudioData(await new Blob(chunks).arrayBuffer());
  ac.close();
  return ab;
}
async function getAudioEncoded(src){
  let ab = null;
  try { ab = await decodeFromFile(src); log('Audio decoded from the file.'); }
  catch (e) { log('Direct audio decode failed (' + ((e && e.message) || e) + '). Trying real-time capture…'); }
  if (!ab && !cancelled && src !== file) log('Could not read the audio file you chose.');
  else if (!ab && !cancelled && !$('rtCap').checked) log('Skipping slow real-time capture. Tip: pick an .m4a of the audio in the "Audio file" box, or tick the real-time option.');
  if (!ab && !cancelled && src === file && $('rtCap').checked) {
    try { ab = await captureRealtime(); if (ab) log('Audio captured in real time.'); }
    catch (e) { log('Real-time capture failed: ' + ((e && e.message) || e)); }
  }
  if (!ab) return null;
  const enc = await pickAudioCodec(ab);
  if (!enc) { log('This browser cannot encode AAC or Opus audio.'); return null; }
  return { mode: 'encode', ab, codec: enc.codec, mux: enc.mux, channels: Math.min(2, ab.numberOfChannels), sampleRate: ab.sampleRate };
}
// Best path: copy the original AAC stream out of the source MP4/MOV untouched.
async function passthroughAudio(src){
  if (!(await mp4boxReady) || !window.MP4Box) throw new Error('demuxer library did not load');
  const buf = await src.arrayBuffer();
  return await new Promise((res, rej) => {
    const mp4 = MP4Box.createFile();
    let ready = false, track = null, desc = null, aacCodec = 'mp4a.40.2';
    const samples = [];
    mp4.onError = e => rej(new Error('demux error: ' + e));
    mp4.onReady = info => {
      ready = true;
      track = info.audioTracks && info.audioTracks[0];
      if (!track) return;
      if (!/^mp4a/.test(track.codec) || /^mp4a\.(?!40)/.test(track.codec)) return rej(new Error('audio codec is ' + track.codec + ', not AAC'));
      try {
        const trak = mp4.getTrackById(track.id);
        const find = (o, d) => {
          if (!o || typeof o !== 'object' || d > 6) return null;
          if (o.type === 'esds' && o.esd) return o;
          for (const k in o) {
            if (k === 'parent' || k === 'data') continue;
            const r = find(o[k], d + 1);
            if (r) return r;
          }
          return null;
        };
        const esds = find(trak.mdia.minf.stbl.stsd.entries[0], 0);
        if (esds) desc = esds.esd.descs[0].descs[0].data;
      } catch (e) { desc = null; }
      if (!desc) {
        // QuickTime .mov files often hide the AAC config. Build the standard 2-byte AAC-LC config instead.
        const rates = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000, 7350];
        const fi = rates.indexOf(track.audio.sample_rate), ch = track.audio.channel_count;
        if (fi < 0 || ch < 1 || ch > 7) return rej(new Error('could not read AAC config'));
        desc = new Uint8Array([(2 << 3) | (fi >> 1), ((fi & 1) << 7) | (ch << 3)]);
      }
      { const aot = desc[0] >> 3; aacCodec = 'mp4a.40.' + (aot >= 1 && aot <= 29 ? aot : 2); }
      mp4.setExtractionOptions(track.id, null, { nbSamples: 2000 });
      mp4.start();
    };
    mp4.onSamples = (id, u, ss) => {
      for (const x of ss) samples.push({ data: x.data, ts: x.cts / x.timescale * 1e6, dur: x.duration / x.timescale * 1e6, key: x.is_sync });
    };
    buf.fileStart = 0;
    mp4.appendBuffer(buf);
    mp4.flush();
    if (!ready) return rej(new Error('not an MP4/MOV container'));
    if (!track) return res('none');
    if (!desc || !samples.length) return rej(new Error('no audio samples found'));
    res({ mode: 'copy', mux: 'aac', codec: aacCodec, channels: track.audio.channel_count, sampleRate: track.audio.sample_rate, desc, samples });
  });
}
async function getAudio(){
  const src = $('audioFile').files[0] || file;
  if (src !== file) log('Using audio from ' + src.name);
  try {
    const p = await passthroughAudio(src);
    if (p === 'none') { log('Source has no audio track.'); return null; }
    log('Found original AAC audio (' + p.samples.length + ' packets).');
    return p;
  } catch (e) {
    log('Cannot copy original audio (' + ((e && e.message) || e) + '). Re-encoding instead…');
  }
  return getAudioEncoded(src);
}
async function encodeAudio(a, muxer){
  const ab = a.ab, ch = Math.min(2, ab.numberOfChannels), sr = ab.sampleRate;
  let err = null;
  const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => err = e });
  aenc.configure({ codec: a.codec, sampleRate: sr, numberOfChannels: ch, bitrate: 192000 });
  const chans = []; for (let c = 0; c < ch; c++) chans.push(ab.getChannelData(c));
  for (let s = 0; s < ab.length; s += sr) {
    if (err) throw err;
    const n = Math.min(sr, ab.length - s);
    const data = new Float32Array(n * ch);
    for (let c = 0; c < ch; c++) data.set(chans[c].subarray(s, s + n), c * n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: ch, timestamp: Math.round(s / sr * 1e6), data });
    aenc.encode(ad); ad.close();
    while (aenc.encodeQueueSize > 8) await sleep(2);
  }
  await aenc.flush(); aenc.close();
  if (err) throw err;
}

// ---------- main ----------
function fmtT(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

async function run(){
  if (running) return;
  running = true; cancelled = false;
  $('go').disabled = true; $('stop').disabled = false; $('resultCard').classList.add('hide');
  try {
    if (!('VideoEncoder' in window)) throw new Error('No WebCodecs support in this browser. Use Chrome or Edge.');
    if (!(await muxerReady)) throw new Error('Could not load the MP4 muxer library (needs internet access to a CDN).');

    const srcFps = +$('srcFps').value, outFps = +$('outFps').value;
    const sharp = +$('sharp').value, R = +$('range').value;
    const useMV = $('interp').value === 'mv';
    const targetH = +$('outH').value;
    const sw = meta.w, sh = meta.h;
    let outH = targetH ? targetH : sh;
    let outW = Math.round(sw * outH / sh);
    outW &= ~1; outH &= ~1;

    const nSrc = Math.max(2, Math.floor(meta.dur * srcFps + 1e-6));
    const nOut = Math.floor(nSrc * outFps / srcFps);
    log(`Source ${sw}×${sh} @ ${srcFps}fps (${nSrc} frames) → ${outW}×${outH} @ ${outFps}fps (${nOut} frames)`);

    // encoder config
    const bitrate = Math.round(+$('mbps').value * 1e6);
    const codecs = ['avc1.640033', 'avc1.64002A', 'avc1.640028', 'avc1.4D0033', 'avc1.4D002A', 'avc1.42E01F'];
    let codec = null;
    for (const c of codecs) {
      try {
        const s = await VideoEncoder.isConfigSupported({ codec: c, width: outW, height: outH, bitrate, framerate: outFps });
        if (s.supported) { codec = c; break; }
      } catch (e) {}
    }
    if (!codec) throw new Error('No supported H.264 encoder configuration for this size.');
    log('Encoder: ' + codec);

    $('stats').textContent = 'Preparing audio…';
    const aud = await getAudio();
    if (cancelled) { log('Cancelled.'); return; }
    log(aud ? (aud.mode === 'copy' ? 'Original audio will be copied untouched.' : 'Audio will be re-encoded as ' + aud.mux.toUpperCase() + '.') : 'WARNING: no usable audio, output will have no sound.');

    const target = new Mp4Muxer.ArrayBufferTarget();
    const muxer = new Mp4Muxer.Muxer({
      target,
      video: { codec: 'avc', width: outW, height: outH, frameRate: outFps },
      audio: aud ? { codec: aud.mux, numberOfChannels: aud.channels, sampleRate: aud.sampleRate } : undefined,
      fastStart: 'in-memory',
      firstTimestampBehavior: 'offset'
    });
    // Audio is fed in step with the video so the MP4 is properly interleaved.
    let audioIdx = 0, audioPos = 0, aenc = null, aErr = null;
    if (aud && aud.mode === 'encode') {
      aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => aErr = e });
      aenc.configure({ codec: aud.codec, sampleRate: aud.sampleRate, numberOfChannels: aud.channels, bitrate: 192000 });
    }
    async function pumpAudio(uptoUs){
      if (!aud) return;
      if (aud.mode === 'copy') {
        while (audioIdx < aud.samples.length && aud.samples[audioIdx].ts <= uptoUs) {
          const x = aud.samples[audioIdx];
          const m = audioIdx === 0 ? { decoderConfig: { codec: aud.codec, numberOfChannels: aud.channels, sampleRate: aud.sampleRate, description: aud.desc } } : undefined;
          muxer.addAudioChunkRaw(x.data, x.key ? 'key' : 'delta', Math.round(x.ts), Math.round(x.dur), m);
          audioIdx++;
        }
      } else {
        const sr = aud.sampleRate, ab = aud.ab, ch = aud.channels;
        while (audioPos < ab.length && audioPos / sr * 1e6 <= uptoUs) {
          if (aErr) throw aErr;
          const n = Math.min(sr >> 1, ab.length - audioPos);
          const data = new Float32Array(n * ch);
          for (let c = 0; c < ch; c++) data.set(ab.getChannelData(c).subarray(audioPos, audioPos + n), c * n);
          const ad = new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: ch, timestamp: Math.round(audioPos / sr * 1e6), data });
          aenc.encode(ad); ad.close();
          audioPos += n;
          while (aenc.encodeQueueSize > 8) await sleep(2);
        }
      }
    }
    let encErr = null, outBytes = 0;
    const audioEst = 192000 / 8 * meta.dur;
    const venc = new VideoEncoder({ output: (c, m) => { outBytes += c.byteLength; muxer.addVideoChunk(c, m); }, error: e => encErr = e });
    venc.configure({ codec, width: outW, height: outH, bitrate, framerate: outFps, latencyMode: 'quality' });

    // GL
    const G = makeGL(outW, outH), gl = G.gl, u = G.u;
    gl.uniform2f(u.srcSize, sw, sh);
    gl.uniform1f(u.sharp, sharp);
    gl.uniform1i(u.useMV, useMV ? 1 : 0);

    // low-res grayscale for motion search
    const lowW = 384;
    const lowH = Math.max(16, Math.round(lowW * sh / sw / 8) * 8);
    const sc = document.createElement('canvas'); sc.width = lowW; sc.height = lowH;
    const sctx = sc.getContext('2d', { willReadFrequently: true });
    sctx.imageSmoothingQuality = 'medium';

    let sa = { tex: G.mkTex(), gray: new Uint8Array(lowW * lowH), idx: -1 };
    let sb = { tex: G.mkTex(), gray: new Uint8Array(lowW * lowH), idx: -1 };
    const mvTex = G.mkTex();
    let mvPair = -1, cut = false;
    const dur = meta.dur;

    async function loadInto(slot, idx){
      await seek(video, Math.min((idx + 0.5) / srcFps, dur - 0.001));
      await settle(video);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, slot.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
      if (useMV) {
        sctx.drawImage(video, 0, 0, lowW, lowH);
        const d = sctx.getImageData(0, 0, lowW, lowH).data;
        for (let i = 0, j = 0; j < slot.gray.length; i += 4, j++) slot.gray[j] = (d[i]*77 + d[i+1]*150 + d[i+2]*29) >> 8;
      }
      slot.idx = idx;
    }

    gl.uniform2f(u.mvRange, (R + 1) / lowW, (R + 1) / (lowH));

    const t0 = performance.now();
    let lastUi = 0;
    for (let k = 0; k < nOut; k++) {
      if (cancelled) break;
      if (encErr) throw encErr;
      const s = k * srcFps / outFps;
      let i = Math.floor(s + 1e-9), t = s - i;
      if (i >= nSrc - 1) { i = nSrc - 1; t = 0; }
      const needB = t > 0.001;

      if (sa.idx !== i) {
        if (sb.idx === i) { const tmp = sa; sa = sb; sb = tmp; }
        else await loadInto(sa, i);
      }
      let mode = 1;
      if (needB) {
        if (sb.idx !== i + 1) { await loadInto(sb, i + 1); mvPair = -1; }
        if (useMV && mvPair !== i) {
          const r = motion(sa.gray, sb.gray, lowW, lowH, 8, R);
          gl.activeTexture(gl.TEXTURE2);
          gl.bindTexture(gl.TEXTURE_2D, mvTex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, r.bw, r.bh, 0, gl.RGBA, gl.UNSIGNED_BYTE, r.bytes);
          cut = r.mean > 45;
          mvPair = i;
        }
        mode = cut && useMV ? (t < 0.5 ? 1 : 2) : 0;
      }

      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sa.tex);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sb.idx >= 0 ? sb.tex : sa.tex);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, mvTex);
      gl.uniform1f(u.t, t);
      gl.uniform1i(u.mode, mode);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      const frame = new VideoFrame(G.canvas, { timestamp: Math.round(k * 1e6 / outFps), duration: Math.round(1e6 / outFps) });
      venc.encode(frame, { keyFrame: k % 120 === 0 });
      frame.close();
      while (venc.encodeQueueSize > 6) { if (encErr) throw encErr; await sleep(3); }
      await pumpAudio(k * 1e6 / outFps + 300000);

      const now = performance.now();
      if (now - lastUi > 150 || k === nOut - 1) {
        lastUi = now;
        const done = k + 1, el = (now - t0) / 1000, rate = done / el;
        $('prog').style.width = (done / nOut * 100).toFixed(1) + '%';
        document.title = Math.round(done / nOut * 100) + '% · Frame Boost';
        $('stats').textContent = `${done}/${nOut} frames · ${rate.toFixed(1)} fps · ${fmtT(el)} elapsed · ~${fmtT((nOut - done) / rate)} left · size ~${fmtSize(outBytes / done * nOut + (aud ? audioEst : 0))}`;
      }
    }

    if (cancelled) {
      try { venc.close(); } catch(e){}
      try { if (aenc) aenc.close(); } catch(e){}
      log('Cancelled.');
    } else {
      await venc.flush(); venc.close();
      if (encErr) throw encErr;
      await pumpAudio(Infinity);
      if (aenc) { await aenc.flush(); aenc.close(); if (aErr) throw aErr; }
      muxer.finalize();
      const blob = new Blob([target.buffer], { type: 'video/mp4' });
      const name = file.name.replace(/\.[^.]+$/, '') + `_${outH}p_${Math.round(outFps)}fps.mp4`;
      const url = URL.createObjectURL(blob);
      $('result').innerHTML = '';
      const a = document.createElement('a'); a.className = 'dl'; a.href = url; a.download = name;
      a.textContent = `Download ${name} (${(blob.size / 1048576).toFixed(1)} MB)`;
      const pv = document.createElement('video'); pv.src = url; pv.controls = true; pv.playsInline = true;
      const note = document.createElement('div'); note.className = 'sub'; note.style.marginTop = '8px';
      note.textContent = aud ? (aud.mode === 'copy' ? 'Audio: original track copied untouched.' : 'Audio: re-encoded as ' + aud.mux.toUpperCase() + '.') : 'Audio: none (see log).';
      $('result').append(a, note, pv);
      $('resultCard').classList.remove('hide');
      log(`Done in ${fmtT((performance.now() - t0) / 1000)}.`);
      notify('Frame Boost', 'Your video is ready to download.');
    }
    const ext = gl.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext();
  } catch (e) {
    console.error(e);
    log('Error: ' + (e && e.message ? e.message : e));
  } finally {
    running = false;
    stopKeepAlive();
    $('go').disabled = false; $('stop').disabled = true;
  }
}
$('go').onclick = () => {
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
  startKeepAlive();
  run();
};
$('stop').onclick = () => { cancelled = true; };
})();
</script>
